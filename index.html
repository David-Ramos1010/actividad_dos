<!DOCTYPE html>
<html lang = es>
	<head>
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
		<title>
			Act 2 - Uso de una biblioteca
		</title>
		<script src = "js/utileria.js" defer></script>
		<link rel = "stylesheet" href = "css/utileria.css">
	</head>

	<body>
		<div class = "barra-superior">
			<a href = "login.html" class = "enlace-login">Iniciar sesión</a>
		</div>
		<div class = "contenedor-formulario">
			<h1>Contáctanos</h1>
			<p class = "subtitulo">¿Tienes dudas? Escríbenos y te responderemos en menos de 24 horas.</p>
			<form class = "formulario" novalidate>

				<div class = "grupo-formulario"> 
					<label for = "nombre">Nombre completo</label>
					<input type = "text" id = "nombre" placeholder = "Ej: David Ramos" >
					<small class="error" id="error-nombre"></small>
				</div>

				<div class = "grupo-doble">
					<div class = "grupo-formulario">
						<label for = "email">Email</label>
						<input type = "email" id = "email" placeholder = "Ej: DavidRamos@ejemplo.com" >
						<small class="error" id="error-email"></small>
					</div>

					<div class = "grupo-formulario">
						<label for = "telefono">Teléfono <span>(opcional)</span></label>
						<input type = "tel" id = "telefono" placeholder = "Ej: +52 951 1234 567">
						<small class="error" id="error-telefono"></small>					
					</div>
				</div>
				
				<div class = "grupo-formulario">
					<label for = "mensaje">Mensaje</label>
					<textarea id = "mensaje" rows= "5" placeholder = "Escribe tu consulta..." ></textarea>
					<small class="error" id="error-mensaje"></small>
				</div>
				
				<button type = "submit" class = "boton-enviar">
					Enviar Mensaje <span>→</span>
				</button>
				<div id="mensaje-general" class="mensaje-general"></div>
			</form>
		</div>
		<footer>
			<p style = "text-align: center; margin-top: 19px;"><em>© - David Efraín Jose Ramos - NL 19</em></p>
		</footer>
	</body>
</html>
